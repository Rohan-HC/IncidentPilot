name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install local project and test dependencies
        run: python -m pip install -e '.[dev,rag,graph]'
      - name: Run tests without model downloads
        env:
          HF_HUB_OFFLINE: '1'
          LANGCHAIN_TRACING_V2: 'false'
        run: python -m pytest -q
