name: CI and Container Delivery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev,rag,graph]'
      - name: Run deterministic tests (no Ollama required)
        env:
          HF_HUB_OFFLINE: '1'
          LANGCHAIN_TRACING_V2: 'false'
        run: python -m pytest -q

  container:
    name: Docker build, smoke test and publish
    needs: pytest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set lowercase GHCR image name
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container for verification
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test FastAPI container
        shell: bash
        run: |
          docker run -d --name incidentpilot-ci -p 8000:8000 "${IMAGE}:ci"
          trap 'docker rm -f incidentpilot-ci >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS --max-time 5 http://127.0.0.1:8000/health | grep -q '"status":"ok"'; then
              echo "Container health check passed"
              exit 0
            fi
            sleep 3
          done
          docker logs incidentpilot-ci
          exit 1

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          SHA_TAG="sha-${GITHUB_SHA::7}"
          docker tag "${IMAGE}:ci" "${IMAGE}:${SHA_TAG}"
          docker tag "${IMAGE}:ci" "${IMAGE}:latest"
          docker push "${IMAGE}:${SHA_TAG}"
          docker push "${IMAGE}:latest"
