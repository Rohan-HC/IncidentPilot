[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "incidentpilot"
version = "0.1.0"
description = "A local, simulated agentic incident response system"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2,<3",
  "langchain-core>=1,<2",
  "langchain-ollama>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
rag = ["chromadb>=1,<2", "sentence-transformers>=3,<6"]
graph = ["langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
incidentpilot = ["data/runbooks/*.md"]
